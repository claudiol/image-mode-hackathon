###############################################################################
# Builder and target operating system
###############################################################################

- name: IMAGE MODE AMI | Validate Image Builder operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "RedHat"
      - ansible_facts.distribution_major_version | int >= 9
    fail_msg: >-
      This role requires a RHEL 9 or later Image Builder host. Detected
      {{ ansible_facts.distribution | default('unknown') }}
      {{ ansible_facts.distribution_version | default('unknown') }}.

- name: IMAGE MODE AMI | Normalize RHEL version values
  ansible.builtin.set_fact:
    image_mode_builder_major_version: >-
      {{ ansible_facts.distribution_major_version | string }}
    image_mode_requested_major_version: >-
      {{ image_mode_rhel_major_version | string }}
    image_mode_requested_release_major_version: >-
      {{ image_mode_rhel_release.split('.')[0] | string }}

- name: IMAGE MODE AMI | Validate configured RHEL major version
  ansible.builtin.assert:
    that:
      - image_mode_requested_major_version in image_mode_base_images
      - >-
        image_mode_requested_release_major_version
        ==
        image_mode_requested_major_version
    fail_msg: >-
      The configured RHEL versions are inconsistent.
      image_mode_rhel_major_version={{ image_mode_rhel_major_version }}
      and image_mode_rhel_release={{ image_mode_rhel_release }}.

- name: IMAGE MODE AMI | Resolve expected RHEL images
  ansible.builtin.set_fact:
    image_mode_expected_base_image: >-
      {{
        image_mode_base_images[
          image_mode_requested_major_version
        ]
      }}
    image_mode_expected_bootc_builder_image: >-
      registry.redhat.io/rhel{{ image_mode_requested_major_version
      }}/bootc-image-builder:latest

- name: IMAGE MODE AMI | Display effective RHEL image selection
  ansible.builtin.debug:
    msg:
      image_builder_os: >-
        {{ ansible_facts.distribution }}
        {{ ansible_facts.distribution_version }}
      image_builder_major_version: "{{ image_mode_builder_major_version }}"
      requested_rhel_major_version: "{{ image_mode_requested_major_version }}"
      requested_rhel_release: "{{ image_mode_rhel_release }}"
      configured_base_image: "{{ image_mode_base_image }}"
      expected_base_image: "{{ image_mode_expected_base_image }}"
      configured_builder_image: "{{ image_mode_bootc_builder_image }}"
      expected_builder_image: "{{ image_mode_expected_bootc_builder_image }}"

- name: IMAGE MODE AMI | Validate builder and target RHEL versions match
  ansible.builtin.assert:
    that:
      - >-
        image_mode_requested_major_version
        ==
        image_mode_builder_major_version
    fail_msg: >-
      The Image Builder host is RHEL
      {{ image_mode_builder_major_version }}, but the requested target image is
      RHEL {{ image_mode_requested_major_version }}. This workflow requires
      the builder and target major versions to match.

- name: IMAGE MODE AMI | Validate selected RHEL container images
  ansible.builtin.assert:
    that:
      - image_mode_base_image == image_mode_expected_base_image
      - >-
        image_mode_bootc_builder_image
        ==
        image_mode_expected_bootc_builder_image
    fail_msg: >-
      Incorrect RHEL container image selection. The requested target is RHEL
      {{ image_mode_requested_major_version }}. Expected base image
      {{ image_mode_expected_base_image }}, but received
      {{ image_mode_base_image }}. Expected builder image
      {{ image_mode_expected_bootc_builder_image }}, but received
      {{ image_mode_bootc_builder_image }}.